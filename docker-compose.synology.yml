# DBX MCP Gateway 部署文件（群晖 Container Manager / 通用 Docker Compose）。
#
# 部署前准备：
#   - 将 gateway.env.example 另存为 /volume1/docker/dbx/gateway.env，
#     并为 DBX_WEB_MCP_TOKEN、MCP_GATEWAY_UPSTREAM_TOKEN 填入相同的随机值。
#   - 确保 /volume1/docker/dbx/data/mcp-gateway 目录存在且可写。
#
# 升级：更新 mcp-gateway 的镜像版本号后重新拉取并启动服务。
#
# 安全建议：
#   - 仅对外暴露网关端口；如不需要 dbx Web，可移除 dbx 的 4224 端口映射。
#   - dbx Web 与网关 UI 请使用相同的主机名访问，以复用登录会话。

services:
  dbx:
    image: docker.cnb.cool/dbxio.com/dbx:latest
    pull_policy: always
    ports:
      - "4224:4224"
    volumes:
      - /volume1/docker/dbx/data:/app/data
    env_file:
      - ./gateway.env
    environment:
      # 网关注入的 Host 是 dbx:4224，必须加入 dbx 白名单。
      DBX_WEB_MCP_ALLOWED_HOSTS: dbx:4224
      # 若 dbx 配了 base path，这里与 MCP_GATEWAY_UPSTREAM_MCP_PATH 同步修改。
      # DBX_PUBLIC_BASE_PATH: /
    restart: unless-stopped

  mcp-gateway:
    image: ghcr.io/minibear2021/dbx-mcp-gateway:1.2.0
    pull_policy: always
    depends_on:
      - dbx
    ports:
      - "4225:4225"
    volumes:
      # token 库与审计日志的持久化目录。
      - /volume1/docker/dbx/data/mcp-gateway:/data
    env_file:
      - ./gateway.env
    environment:
      MCP_GATEWAY_UPSTREAM_URL: http://dbx:4224
      MCP_GATEWAY_UPSTREAM_MCP_PATH: /mcp
      MCP_GATEWAY_DATA_DIR: /data
      MCP_GATEWAY_LISTEN_HOST: 0.0.0.0
      MCP_GATEWAY_LISTEN_PORT: "4225"
      MCP_GATEWAY_PUBLIC_MCP_PATH: /mcp
      # 使用 dbx 默认 base path 时留空；若 dbx 用 /dbx，这里设为 /dbx 且上行设为 /dbx/mcp。
      MCP_GATEWAY_DBX_BASE_PATH: ""
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4225/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
