# DBX MCP Gateway 叠加配置，与 dbx 基础 compose 文件配合使用：
#   docker compose --project-directory . \
#     -f deploy/docker-compose.yml \
#     -f plugins/mcp-token-gateway/docker-compose.mcp-gateway.yml \
#     --env-file plugins/mcp-token-gateway/.env up -d
#
# 特性：
#   - MCP、Web UI 与管理界面统一使用 4225 端口。
#   - 管理界面复用 dbx Web 登录会话，无需额外凭据。
#   - dbx Web 与网关 UI 请使用相同的主机名访问。

services:
  dbx:
    environment:
      DBX_WEB_MCP_TOKEN: ${DBX_MCP_INTERNAL_TOKEN:?请在 .env 中设置 DBX_MCP_INTERNAL_TOKEN}
      # 网关注入的 Host 是 dbx:4224，需与 dbx 的 Host 白名单一致。
      DBX_WEB_MCP_ALLOWED_HOSTS: dbx:4224
      DBX_PUBLIC_BASE_PATH: ${DBX_PUBLIC_BASE_PATH:-/}

  mcp-gateway:
    build:
      context: .
      dockerfile: plugins/mcp-token-gateway/Dockerfile
    depends_on:
      - dbx
    ports:
      - "${MCP_GATEWAY_PUBLIC_PORT:-4225}:4225"
    environment:
      MCP_GATEWAY_UPSTREAM_URL: http://dbx:4224
      MCP_GATEWAY_UPSTREAM_MCP_PATH: ${MCP_GATEWAY_UPSTREAM_MCP_PATH:-/mcp}
      MCP_GATEWAY_UPSTREAM_TOKEN: ${DBX_MCP_INTERNAL_TOKEN:?请在 .env 中设置 DBX_MCP_INTERNAL_TOKEN}
      MCP_GATEWAY_DBX_BASE_PATH: ${DBX_PUBLIC_BASE_PATH:-}
      MCP_GATEWAY_DBX_WEB_URL: ${MCP_GATEWAY_DBX_WEB_URL:-}
      MCP_GATEWAY_ALLOWED_ORIGINS: ${MCP_GATEWAY_ALLOWED_ORIGINS:-}
      # 前置可信反向代理时设为 1，审计才采信 X-Forwarded-For / X-Real-IP。
      MCP_GATEWAY_TRUST_PROXY: ${MCP_GATEWAY_TRUST_PROXY:-0}
    volumes:
      - mcp-gateway-data:/app/gateway-data
    restart: unless-stopped
    stop_grace_period: 15s

volumes:
  mcp-gateway-data:
