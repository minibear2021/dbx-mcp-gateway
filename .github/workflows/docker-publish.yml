name: Build and publish Docker image

on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and decide publish
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          current="$(node -p "require('./package.json').version")"
          echo "package.json version: ${current}"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME#v}"
            if [[ "${tag}" != "${current}" ]]; then
              echo "::error::tag v${tag} 与 package.json 版本 ${current} 不一致"
              exit 1
            fi
            echo "Tag v${tag} matches package.json"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "Manual dispatch, publishing ${current}"
          else
            previous=""
            if git cat-file -e HEAD^:package.json 2>/dev/null; then
              previous="$(git show HEAD^:package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")"
            fi
            if [[ "${current}" == "${previous}" ]]; then
              echo "Version unchanged (${current}), skipping publish"
              echo "version=" >> "$GITHUB_OUTPUT"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Version changed: ${previous:-none} -> ${current}"
          fi

          echo "version=${current}" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

  docker:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 按 Dockerfile 预期的目录结构准备构建上下文。
      - name: Prepare build context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-context/plugins/mcp-token-gateway
          cp Dockerfile package.json build-context/plugins/mcp-token-gateway/
          cp -R src bin assets build-context/plugins/mcp-token-gateway/
          find build-context -maxdepth 4 -type f | sort

      - name: Set lowercase image name
        shell: bash
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=v${{ needs.prepare.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}

      - uses: docker/build-push-action@v6
        with:
          context: build-context
          file: build-context/plugins/mcp-token-gateway/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
